services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: prompt_hub_development
      MYSQL_USER: prompt_hub
      MYSQL_PASSWORD: prompt_hub_password
    ports:
      - "3306:3306"
    volumes:
      - prompt_hub_mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  prompt_hub_mysql:
